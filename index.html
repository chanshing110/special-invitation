<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專屬我們的約會邀請函 💌</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f43f5e;
      --primary-soft: #fda4af;
      --primary-bg: #fff1f2;
      --accent: #fb7185;
      --text-main: #4c0519;
      --text-muted: #9f1239;
      --card-bg: rgba(255, 255, 255, 0.88);
    }

    * {
      box-sizing: border-box;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 45%, #fbcfe8 100%);
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
    }

    .floating-bokeh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bokeh-item {
      position: absolute;
      bottom: -40px;
      font-size: 1.15rem;
      opacity: 0.45;
      animation: floatUp 12s linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(0.85); opacity: 0; }
      20% { opacity: 0.5; }
      80% { opacity: 0.4; }
      100% { transform: translateY(-110vh) rotate(240deg) scale(1.15); opacity: 0; }
    }

    .glass-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.92);
      border-radius: 32px;
      padding: 32px 24px;
      box-shadow: 0 20px 45px rgba(244, 63, 94, 0.16);
    }

    .option-card {
      border: 2px solid #ffe4e6;
      border-radius: 18px;
      padding: 14px 10px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      user-select: none;
      background: rgba(255, 255, 255, 0.78);
      color: var(--text-main);
      font-size: 0.92rem;
      box-shadow: 0 4px 10px rgba(244, 63, 94, 0.04);
    }

    .option-card:hover {
      border-color: var(--primary-soft);
      transform: translateY(-2px);
    }

    .option-card.active {
      border-color: var(--primary);
      background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
      color: var(--primary);
      font-weight: 700;
      transform: scale(1.03);
      box-shadow: 0 8px 18px rgba(244, 63, 94, 0.16);
    }

    .custom-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #ffe4e6;
      border-radius: 16px;
      font-size: 0.92rem;
